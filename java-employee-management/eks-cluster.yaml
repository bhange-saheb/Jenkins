apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: employee-management-cluster
  region: us-east-1
  version: "1.36"

managedNodeGroups:
  - name: employee-management-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3

    volumeSize: 30
    volumeType: gp3

    labels:
      role: application

    tags:
      Project: employee-management
      Environment: dev
